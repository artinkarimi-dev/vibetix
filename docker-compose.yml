services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: vibetix
      POSTGRES_USER: vibetix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vibetix -d vibetix']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: development
      DATABASE_ADMIN_URL: postgresql://vibetix:${POSTGRES_PASSWORD}@postgres:5432/vibetix
      MIGRATION_DATABASE_URL: postgresql://vibetix_migrator:${MIGRATION_DATABASE_PASSWORD:?Generate a separate migration password}@postgres:5432/vibetix
      DATABASE_URL: postgresql://vibetix_app:${APP_DATABASE_PASSWORD:?Generate a separate app password}@postgres:5432/vibetix
      DATABASE_EXPECTED_NAME: vibetix
      ALLOW_DATABASE_ADMIN_OPERATION: 'true'
      SEED_DEVELOPMENT_DATA: 'true'
    command: [node, scripts/ops/migration-job.mjs]
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    user: redis
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-env
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://vibetix_app:${APP_DATABASE_PASSWORD}@postgres:5432/vibetix?schema=public
      APP_ORIGIN: http://127.0.0.1:8080
      TICKET_SIGNING_KEY: ${TICKET_SIGNING_KEY:?Run node scripts/setup-local.mjs first}
      ALLOW_SIMULATED_PAYMENTS: 'true'
      EMAIL_TRANSPORT: local
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379
      ABUSE_KEY_SECRET: ${ABUSE_KEY_SECRET:?Generate an independent abuse key}
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m', '/app/artifacts:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=0700']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    command: [node, backend/dist/backend/src/worker.js]
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m', '/app/artifacts:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=0700']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['127.0.0.1:8080:8080']
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres-data:
