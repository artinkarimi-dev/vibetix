name: Stage 4 Release Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibetix-stage4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-release-gate:
    name: Stage 1–4 tests and release policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm stage4:check
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck && pnpm backend:typecheck
      - run: pnpm build && pnpm backend:build
      - run: pnpm security:check && pnpm build:audit && pnpm images:audit
      - name: Export static evidence (not a live Docker pass)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-static-evidence
          path: |
            artifacts/stage4/release-gate.json
            artifacts/stage4/release-gate.md
            artifacts/security/static-checks.json
          if-no-files-found: warn
          retention-days: 14

  live-integrity-gate:
    name: Stage 1 full stack + isolated 1,000 HTTP/10 seats/PostgreSQL
    if: github.event_name != 'pull_request'
    needs: static-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      STAGE4_CONCURRENCY: '24'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Check isolated runner prerequisites
        run: |
          docker compose version
          docker info --format '{{.ServerVersion}}'
      - name: Actual Docker + HTTP + PostgreSQL release gate
        run: pnpm stage4:verify
      - name: Export machine-verifiable results (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-live-evidence
          path: |
            artifacts/stage4/release-gate.json
            artifacts/stage4/release-gate.md
            artifacts/stage3/verified-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop development stack without deleting database volumes
        if: always()
        run: |
          if [ -f .env.local ]; then node scripts/stage1-up.mjs down || true; fi
